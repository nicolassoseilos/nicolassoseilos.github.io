<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria – your calls</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#e3e6ea;--accent:#0f766e;--accent2:#14b8a6;--bad:#b42318;--warn:#b54708;--ok:#067647;--chip:#eef2f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e8ebef;--mute:#9aa4b1;--line:#2a3038;--accent:#2dd4bf;--accent2:#5eead4;--bad:#f97066;--warn:#fdb022;--ok:#47cd89;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top))}
.hin{max-width:868px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.live{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mute);background:var(--chip);border-radius:999px;padding:6px 12px 6px 10px;white-space:nowrap}
.live.on{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.live.on{background:#14532d;color:#bbf7d0}}
.dot{width:12px;height:12px;border-radius:50%;background:#9aa4b1;flex:none}
.dot.on{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
nav.tabs button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;gap:4px;flex-wrap:nowrap;flex:none}
.seg button{padding:4px 10px;font-size:13px}
.custom{display:none;gap:6px;align-items:center;font-size:13px}
.custom.on{display:flex}
input[type=date]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 6px}
main{padding:12px 16px;max-width:900px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .n{font-size:24px;font-weight:650}
.cards .card:first-child{background:var(--accent);border-color:var(--accent);color:#fff}
.cards .card:first-child .l{color:rgba(255,255,255,.85)}
a{color:var(--accent)}
.live .short{display:none}
@media (max-width:520px){.live .long{display:none}.live .short{display:inline}}
.langbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.signout{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;margin-left:6px}
.card .l{font-size:12px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--chip);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
canvas{max-height:260px}
.muted{color:var(--mute);font-size:13px}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login h1{font-size:22px}
.login input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.btn{display:inline-block;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;font-size:16px;width:100%;margin-top:8px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{width:auto;padding:6px 12px;font-size:14px;margin:0}
.err{color:var(--bad);font-size:14px;min-height:20px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(640px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:14px 16px;overflow:auto;max-height:80vh}
.dlg pre{white-space:pre-wrap;font:13px/1.5 inherit;background:var(--bg);border-radius:10px;padding:10px}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.tick{display:flex;align-items:center;gap:8px}
.tick input{width:22px;height:22px;accent-color:var(--accent)}
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fbar input[type=search]{flex:1 1 100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:16px}
#fsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 0;min-width:0}
#fsel:empty{display:none}
@media (min-width:700px){.fbar{flex-wrap:nowrap}.fbar input[type=search]{flex:0 1 300px}}
.fbar select{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 8px;font-size:14px;max-width:60vw}
.fbar select.set{border-color:var(--accent);color:var(--accent);font-weight:600}
.fbar .clear{flex:none;border:0;background:transparent;color:var(--accent);font-size:14px;padding:6px 4px}
.showing{margin:-4px 0 10px}
.hide{display:none!important}
.small{font-size:12px}
</style>
</head>
<body>

<div id="loginView" class="login hide">
  <h1>Maria</h1>
  <p class="muted">Sign in to see your calls, bookings and messages.</p>
  <form id="loginForm">
    <input id="email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <button class="btn ghost" id="forgotBtn" type="button">Forgot password?</button>
</div>

<div id="resetView" class="login hide">
  <h1>Set a new password</h1>
  <form id="resetForm">
    <input id="newpw" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" minlength="8" required>
    <div class="err" id="resetErr"></div>
    <button class="btn" type="submit">Save password</button>
  </form>
</div>

<div id="appView" class="hide">
<header><div class="hin">
  <div class="top">
    <div class="logo" id="bizLogo" aria-hidden="true">M</div>
    <h1><span id="bizName">Maria</span><small>Maria, your receptionist</small></h1>
    <button type="button" class="langbtn" id="langBtn" aria-label="Ελληνικά / English">ΕΛ</button>
    <div class="live" id="live" title="Lit whenever Maria is on a call on any line"><span class="dot" id="liveDot"></span><span id="liveText">…</span></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="calls" class="on">Calls</button>
    <button data-tab="bookings">Bookings &amp; money</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="clients">Clients</button>
    <button data-tab="grades">How calls went</button>
    <button data-tab="plan" class="hide" id="planTab">Plan &amp; bills</button>
    <button data-tab="myday" class="hide" id="mydayTab">My day</button>
  </nav>
  <div class="bar">
    <div class="seg" id="ranges">
      <button data-r="1">1 day</button><button data-r="3">3 days</button><button data-r="7" class="on">Week</button>
      <button data-r="30">Month</button><button data-r="365">Year</button><button data-r="custom">Dates…</button>
    </div>
    <div class="custom" id="customBox"><input type="date" id="from"> – <input type="date" id="to"></div>
    <div class="seg" id="modes"><button data-m="list" class="on">List</button><button data-m="graphs">Graphs</button></div>
  </div>
  <div class="fbar" id="fbar">
    <input type="search" id="q" placeholder="Search name, surname, phone…" autocomplete="off" enterkeyhint="search" aria-label="Search">
    <span id="fsel"></span>
    <button class="clear hide" id="fclear" type="button">Clear</button>
  </div>
</div></header>
<main id="main"><p class="muted">Loading…</p></main>
<p class="muted small" style="text-align:center;padding:0 16px 20px">View only. <button type="button" class="signout" id="signOut">Sign out</button></p>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div><div class="dlgfoot" id="dlgFoot"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const CFG = window.PORTAL_CONFIG || {
  url: "https://dlxplhhsjmwilgwwjryx.supabase.co",
  key: "sb_publishable_7G5H8UEOUuRb0Q4rZnebeA_zyBidQeW",
};
const sb = supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, storageKey: "maria-portal"}});
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "Asia/Nicosia";
let LANGSEL = "en";
try { LANGSEL = localStorage.getItem("maria-lang") === "el" ? "el" : "en"; } catch (e) {}
const LOC = LANGSEL === "el" ? "el-GR" : "en-GB";
const fmtDT = d => new Date(d).toLocaleString(LOC, {timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const fmtD = d => new Date(d).toLocaleDateString(LOC, {timeZone: TZ, day: "numeric", month: "short"});
const eur = n => "€" + Math.round(n || 0).toLocaleString("en-GB");
const mins = s => s == null ? "–" : (s >= 60 ? Math.floor(s / 60) + "m " : "") + (s % 60) + "s";
const LANG = {el: "Greek", en: "English", ru: "Russian", greek: "Greek", english: "English"};

let state = {tab: "calls", range: "7", mode: "list", data: null, charts: [], q: "", f: {calls: {}, bookings: {}, messages: {}, clients: {}, grades: {}, myday: {}}};
let me = null, ROLE = "owner";

// ---------- sign in ----------
function show(id) { for (const v of ["loginView", "resetView", "appView"]) $("#" + v).classList.toggle("hide", v !== id); }

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email: $("#email").value.trim(), password: $("#password").value});
  if (error) { $("#loginErr").textContent = "Email or password not right."; return; }
  sb.rpc("note_login", {p_agent: navigator.userAgent}).then(() => {}, () => {});
  start();
});
$("#forgotBtn").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if (!email) { $("#loginErr").textContent = "Type your email first, then tap this again."; return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  $("#loginErr").textContent = error ? "Could not send the email just now. Try again later." : "If that email has an account, a reset link is on its way.";
});
$("#resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const {error} = await sb.auth.updateUser({password: $("#newpw").value});
  if (error) { $("#resetErr").textContent = error.message; return; }
  history.replaceState(null, "", location.pathname); start();
});
$("#signOut").addEventListener("click", async e => { e.preventDefault(); await sb.auth.signOut(); show("loginView"); });
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") show("resetView"); });

// ---------- controls ----------
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.tab; on("#tabs", b); render(); window.scrollTo(0, 0); });
$("#ranges").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; state.range = b.dataset.r; on("#ranges", b);
  $("#customBox").classList.toggle("on", state.range === "custom");
  if (state.range !== "custom") load();
});
$("#modes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.mode = b.dataset.m; on("#modes", b); render(); });
for (const id of ["#from", "#to"]) $(id).addEventListener("change", () => { if ($("#from").value && $("#to").value) load(); });
function on(group, btn) { for (const x of $(group).querySelectorAll("button")) x.classList.toggle("on", x === btn); }

function span() {
  const now = new Date();
  if (state.range === "custom") {
    const a = new Date($("#from").value + "T00:00:00"), b = new Date($("#to").value + "T23:59:59");
    return [a, b];
  }
  const days = +state.range, a = new Date(now);
  a.setHours(0, 0, 0, 0); a.setDate(a.getDate() - (days - 1));
  return [a, now];
}

// ---------- data ----------
async function all(q) {
  let out = [], from = 0;
  for (;;) {
    const {data, error} = await q().range(from, from + 999);
    if (error) throw error;
    out = out.concat(data); if (data.length < 1000) return out; from += 1000;
  }
}
// The Greek summary and the no-booking reason are read once the database has them; before
// that the page asks without them (Q7 a, 4 Nov).
let EXTRA_COLS = true;
async function callsIn(A, B) {
  const q = cols => () => sb.from("call_log").select(cols).gte("call_time", A).lte("call_time", B).order("call_time", {ascending: false});
  if (EXTRA_COLS) {
    try { return await all(q("id,call_time,phone,caller_name,action_taken,service_requested,call_language,duration_s,qa_result,qa_score,qa_notes,staff,summary,got_busy,recording_path,test_call,summary_el,no_booking_reason")); } catch (e) { EXTRA_COLS = false; }
  }
  return all(q("id,call_time,phone,caller_name,action_taken,service_requested,call_language,duration_s,qa_result,qa_score,qa_notes,staff,summary,got_busy,recording_path,test_call"));
}
const summaryOf = c => (LANGSEL === "el" && c.summary_el) || c.summary;
async function loadStaff() {
  const [a, b] = span(), A = a.toISOString(), B = b.toISOString();
  const day = await all(() => sb.from("my_day").select("*").gte("event_time", A).lte("event_time", B).order("event_time", {ascending: false}));
  state.data = {calls: [], books: day, msgs: [], clients: [], a, b};
}
async function loadPlan() {
  const [{data: bill}, {data: inv}, {data: logins}] = await Promise.all([
    sb.from("billing").select("*").maybeSingle(),
    sb.from("invoices").select("*").order("issued_on", {ascending: false}),
    sb.from("portal_logins").select("email,at,agent").order("at", {ascending: false}).limit(50)]);
  state.plan = {bill, inv: inv || [], logins: logins || []};
}
async function load() {
  if (ROLE === "staff") {
    $("#main").innerHTML = '<p class="muted">Loading…</p>';
    try { await loadStaff(); render(); } catch (e) { $("#main").innerHTML = `<div class="panel"><p class="err">Could not load: ${esc(e.message || e)}</p></div>`; }
    return;
  }
  const [a, b] = span();
  $("#main").innerHTML = '<p class="muted">Loading…</p>';
  try {
    const A = a.toISOString(), B = b.toISOString();
    const [calls, books, msgs, clients] = await Promise.all([
      callsIn(A, B),
      all(() => sb.from("bookings_log").select("*").gte("event_time", A).lte("event_time", B).order("event_time", {ascending: false})),
      all(() => sb.from("messages").select("*").gte("created_at", A).lte("created_at", B).order("created_at", {ascending: false})),
      all(() => sb.from("clients").select("id,name,phone,total_visits,last_service,last_appointment,created_at,is_dependent").order("created_at", {ascending: false})),
    ]);
    state.data = {calls, books, msgs, clients, a, b};
    if (!$("#planTab").classList.contains("hide")) await loadPlan().catch(() => {});
    render();
  } catch (e) {
    $("#main").innerHTML = `<div class="panel"><p class="err">Could not load: ${esc(e.message || e)}</p></div>`;
  }
}

// ---------- helpers ----------
function killCharts() { state.charts.forEach(c => c.destroy()); state.charts = []; }
function chart(el, cfg) {
  const css = getComputedStyle(document.documentElement);
  Chart.defaults.color = css.getPropertyValue("--mute").trim();
  Chart.defaults.borderColor = css.getPropertyValue("--line").trim();
  if (LANGSEL === "el" && cfg.data) {  // chart words in Greek too (Q6 k)
    const W = Object.assign({}, EL, {"Mon": "Δευ", "Tue": "Τρί", "Wed": "Τετ", "Thu": "Πέμ", "Fri": "Παρ", "Sat": "Σάβ", "Sun": "Κυρ", "Cancelled": "Ακυρώσεις", "Booked": "Κλεισμένα", "Urgent": "Επείγοντα"});
    if (cfg.data.labels) cfg.data.labels = cfg.data.labels.map(l => W[l] || l);
    for (const d of cfg.data.datasets || []) if (d.label) d.label = W[d.label] || d.label;
  }
  cfg.options = Object.assign({responsive: true, maintainAspectRatio: false, plugins: {legend: {display: cfg.legend || false}}}, cfg.options || {});
  const c = new Chart(el, cfg); state.charts.push(c); return c;
}
const accent = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
function count(arr, key) { const m = new Map(); for (const x of arr) { const k = typeof key === "function" ? key(x) : x[key]; if (k == null || k === "") continue; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); }
function byDay(arr, field, val = () => 1) {
  const [a, b] = [state.data.a, state.data.b], m = new Map();
  for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) m.set(fmtD(d), 0);
  for (const x of arr) { const k = fmtD(x[field]); if (m.has(k)) m.set(k, m.get(k) + val(x)); }
  return [[...m.keys()], [...m.values()]];
}
function cards(items) { return `<div class="cards">${items.map(([n, l]) => `<div class="card"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>`; }
function canvas(title, id) { return `<div class="panel"><h2>${esc(title)}</h2><div style="height:240px"><canvas id="${id}"></canvas></div></div>`; }
function grade(c) {
  if (c.qa_result == null) return '<span class="pill">not graded</span>';
  const cls = c.qa_result === "Pass" ? "ok" : c.qa_result === "Fail" ? "bad" : "warn";
  const word = c.qa_result === "Pass" ? "Handled well" : c.qa_result === "Fail" ? "Not handled well" : "Check";
  return `<span class="pill ${cls}">${word}${c.qa_score != null ? " · " + c.qa_score : ""}</span>`;
}
function hourOf(d) { return +new Date(d).toLocaleString("en-GB", {timeZone: TZ, hour: "2-digit", hour12: false}); }
function dayOf(d) { return new Date(d).toLocaleDateString("en-GB", {timeZone: TZ, weekday: "short"}); }

// ---------- search + filters (Q2, 4 Nov) ----------
// One search box for every page: name, surname, phone (any part, with or without +357 / spaces),
// Greek with or without accents. Plus a few drop-down filters per page, built from what is in the
// chosen dates. Everything on the page (the figures at the top, the lists, the graphs) follows them.
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const digits = s => String(s ?? "").replace(/\D/g, "");
function matches(q, fields) {
  q = q.trim(); if (!q) return true;
  const qd = digits(q);
  if (qd.length >= 4 && /^[\d\s+()\-.]+$/.test(q)) return fields.some(f => digits(f).includes(qd.replace(/^00/, "")));
  const text = norm(fields.join(" · "));
  return norm(q).split(/\s+/).filter(Boolean).every(w => text.includes(w) || (digits(w).length >= 3 && fields.some(f => digits(f).includes(digits(w)))));
}
const RESULT = {"Booked": "Booked", "Rescheduled": "Moved", "Cancelled": "Cancelled", "Question(s) only": "Questions only", "No action": "Nothing done"};
const callResult = c => c.got_busy ? "Got busy" : (RESULT[c.action_taken] || c.action_taken || "Other");
const callGrade = c => c.got_busy ? "" : c.qa_result == null ? "Not graded" : c.qa_result === "Pass" ? "Handled well" : "Not handled well";
const callLang = c => LANG[(c.call_language || "").toLowerCase()] || c.call_language || "";

const isNewClient = c => new Date(c.created_at) >= state.data.a && new Date(c.created_at) <= state.data.b;
const FILTERS = {
  myday: {src: "books", text: b => [b.patient_name, b.phone, b.service],
    by: [["kind", "Change", b => KIND[b.kind] || b.kind], ["service", "Service", b => b.service]]},
  calls: {src: "calls", text: c => [c.caller_name, c.phone, c.summary, c.service_requested, c.staff],

  grades: {src: "calls", text: c => [c.caller_name, c.phone, c.summary, c.qa_notes],
    by: [["result", "Result", callResult], ["lang", "Language", callLang],
         ["score", "Grade", c => c.qa_score == null ? "" : c.qa_score >= 90 ? "90–100" : c.qa_score >= 70 ? "70–89" : c.qa_score >= 50 ? "50–69" : "Under 50"]]},
  bookings: {src: "books", text: b => [b.patient_name, b.phone, b.service, b.staff],

  messages: {src: "msgs", text: m => [m.caller_name, m.phone, m.body, m.backup],
    by: [["done", "Status", m => m.done ? "Done" : "Not done yet"], ["kind", "Type", m => m.kind === "urgent" ? "Urgent" : "Call back"]]},
  clients: {src: "clients", text: c => [c.name, c.phone, c.last_service],
    by: [["new", "Client", c => isNewClient(c) ? "New in these dates" : "From before"],
         ["visits", "Visits", c => !c.total_visits ? "No visits yet" : c.total_visits === 1 ? "1 visit" : "2+ visits"]]},
};
// the rows of one kind ("calls", "books", "msgs", "clients") after this page's search + filters
function F(src) {
  const spec = FILTERS[state.tab], rows = state.data[src];
  if (!spec || spec.src !== src) return rows;
  const set = state.f[state.tab];
  return rows.filter(r => matches(state.q, spec.text(r)) && spec.by.every(([k, , fn]) => !set[k] || fn(r) === set[k]));
}
function filtering() { return !!state.q.trim() || Object.values(state.f[state.tab] || {}).some(Boolean); }
function renderFilters() {
  const spec = FILTERS[state.tab];
  $("#fbar").classList.toggle("hide", !spec);
  if (!spec) return;
  const set = state.f[state.tab], rows = state.data[spec.src];
  $("#fsel").innerHTML = spec.by.map(([k, label, fn]) => {
    const vals = count(rows, fn).map(x => x[0]);
    if (set[k] && !vals.includes(set[k])) vals.unshift(set[k]);
    if (vals.length < 2 && !set[k]) return "";
    return `<select data-f="${k}" class="${set[k] ? "set" : ""}" aria-label="${esc(label)}"><option value="">${esc(label)}: all</option>${vals.map(v => `<option value="${esc(v)}"${v === set[k] ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  }).join("");
  $("#fclear").classList.toggle("hide", !filtering());
}
function showing(shown, total, what) {
  return filtering() ? `<p class="muted showing">Showing ${shown} of ${total} ${what}. <a href="#" data-clear="1">Show all</a></p>` : "";
}
function clearFilters() { state.q = ""; $("#q").value = ""; state.f[state.tab] = {}; render(); }
let qTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $("#q").value; render(); }, 180); });
$("#fsel").addEventListener("change", e => { const s = e.target.closest("select"); if (!s) return; state.f[state.tab][s.dataset.f] = s.value; render(); });
$("#fclear").addEventListener("click", clearFilters);

// ---------- views ----------
function render() {
  killCharts();
  if (!state.data) return;
  renderFilters();
  ({calls: viewCalls, bookings: viewBookings, messages: viewMessages, clients: viewClients, grades: viewGrades, plan: viewPlan, myday: viewMyDay})[state.tab]();
}

function viewCalls() {
  const calls = F("calls");
  const answered = calls.filter(c => !c.got_busy), busy = calls.filter(c => c.got_busy);
  const durs = answered.map(c => c.duration_s).filter(x => x != null);
  const avg = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
  const hours = count(calls, c => hourOf(c.call_time)), langs = count(calls, c => LANG[(c.call_language || "").toLowerCase()] || c.call_language);
  let h = showing(calls.length, state.data.calls.length, "calls") + cards([[calls.length, "calls"], [mins(avg), "average length"], [busy.length, "callers got busy"],
    [hours[0] ? hours[0][0] + ":00" : "–", "busiest hour"], [langs.map(([k, v]) => `${k} ${v}`).join(", ") || "–", "languages"]]);
  if (state.mode === "graphs") {
    h += canvas("Calls per day", "c1") + canvas("Busiest hours", "c2") + canvas("Busiest days", "c3") + canvas("Language", "c4");
    $("#main").innerHTML = h;
    const [l, v] = byDay(calls, "call_time");
    chart($("#c1"), {type: "bar", data: {labels: l, datasets: [{data: v, backgroundColor: accent()}]}});

    chart($("#c2"), {type: "bar", data: {labels: hr.map(i => i + ":00"), datasets: [{data: hv, backgroundColor: accent()}]},

    const dn = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const agentName = a => /iPhone|iPad/.test(a || "") ? "iPhone/iPad" : /Android/.test(a || "") ? "Android phone" : /Windows/.test(a || "") ? "Windows computer" : /Mac/.test(a || "") ? "Mac" : "browser";
function viewBookings() {

function whatWentWrong(notes) {
  const lines = String(notes || "").split("\n").filter(l => /\(-\d+\)|fail|did not|didn't|wrong|missing|premature|should/i.test(l));
  return (lines.length ? lines : String(notes || "").split("\n")).slice(0, 3).join(" · ");
}

// "2026-11-04 12:00 με τον Νίκο" / «Πέμπτη 2026-11-05» -> "Wed 4 Nov, 12:00 με τον Νίκο"
function niceBackup(t) {
  const m = String(t).match(/(\d{4}-\d{2}-\d{2})(?:[ T]+(\d{1,2}:\d{2}))?/);
  if (!m) return t;
  const d = new Date(m[1] + "T12:00:00");
  const day = d.toLocaleDateString(LOC, {weekday: "short", day: "numeric", month: "short"});
  const rest = String(t).replace(m[0], "").replace(/^[\s,·-]*(Δευτέρα|Τρίτη|Τετάρτη|Πέμπτη|Παρασκευή|Σάββατο|Κυριακή)?[\s,·-]*/i, "").trim();
  return day + (m[2] ? ", " + m[2] : "") + (rest ? " " + rest : "");
}
// the grader's notes in plain words for an owner (f)
function plainNotes(n) {
  if (!n) return "Not checked yet.";
  // a call checked twice keeps only the second (deciding) judge's notes; the first judge's
  // notes and the re-check header are for us, not the owner
  return String(n).split(/\n(?=FIRST CHECK)/)[0].split("\n").filter(l => !/^(SECOND CHECK|RE-CHECKED)/.test(l))
    .map(l => l
      .replace(/\bend_call( tool)?\b/g, "ending the call").replace(/\bcheck_availability( tool)?\b/g, "checking the diary")
      .replace(/\bbook_appointment( tool)?\b/g, "booking").replace(/\breschedule_appointment\b/g, "moving the booking")
      .replace(/\bcancel_appointment\b/g, "cancelling").replace(/\bflag_urgent\b/g, "the urgent message")
      .replace(/\bleave_message\b/g, "taking a message").replace(/\bfind_my_appointments\b/g, "looking up the booking")
      .replace(/\btool (call|result)s?\b/gi, "action").replace(/\s*\((?:[-+]\d+)\)/g, "")
      .replace(/^AUTOMATIC FAIL:\s*/, "Counted by the system: "))
    .join("\n");
}

// ---------- tap a call / client ----------
$("#main").addEventListener("click", async e => {
  if (e.target.closest("[data-clear]")) { e.preventDefault(); return clearFilters(); }
  const cb = e.target.closest("input[data-msg]");
  if (cb) { e.preventDefault(); if (ROLE !== "owner") return alertBox("View only: the owner ticks messages done."); return askTick(cb); }
  const r = e.target.closest("[data-call]"); if (r) return openCall(r.dataset.call);
  const k = e.target.closest("[data-client]"); if (k) return openClient(k.dataset.client);
});
async function openCall(id) {
  const c = state.data.calls.find(x => x.id === id);
  dlg(`<h2 style="margin-top:0">${esc(c.caller_name || c.phone || "Unknown caller")}</h2><p class="muted">${fmtDT(c.call_time)} · ${mins(c.duration_s)} · ${esc(c.action_taken || "")}</p><p>${grade(c)}</p>
    <p><b>Summary:</b> ${esc(summaryOf(c) || c.action_taken || "–")}</p>
    ${c.recording_path ? `<audio controls preload="metadata" style="width:100%" id="rec" class="hide"></audio><p class="muted" id="recMsg">Loading the recording…</p>` : `<p class="muted">${c.got_busy ? "No recording: the caller got a busy signal." : "Recording not ready yet."}</p>`}
    <h3>How it went</h3><pre>${esc(plainNotes(c.qa_notes))}</pre><h3>Transcript</h3><pre id="tx">Loading…</pre>`, [["Close", null]]);
  const {data} = await sb.from("call_log").select("transcript").eq("id", id).single();
  $("#tx").textContent = (data && data.transcript || "No transcript.").split("\n").filter(l => !/^\[(tool|call)/.test(l)).join("\n");
  if (c.recording_path) {
    const {data: s} = await sb.storage.from("recordings").createSignedUrl(c.recording_path, 600);
    if (s && $("#rec")) { $("#rec").src = s.signedUrl; $("#rec").classList.remove("hide"); $("#recMsg").remove(); }
    else if ($("#recMsg")) $("#recMsg").textContent = "Recording not ready yet.";
  }
}
const visits = n => !n ? "no visits yet" : n === 1 ? "1 visit" : n + " visits";
async function openClient(id) {
  const c = state.data.clients.find(x => x.id === id);
  dlg(`<h2 style="margin-top:0">${esc(c.name)}</h2><p class="muted">${esc(c.phone)} · client since ${fmtD(c.created_at)} · ${visits(c.total_visits)}</p>
    <div id="hist"><p class="muted">Loading their history…</p></div>`, [["Close", null]]);
  // their whole history, not only the chosen dates
  const [{data: books}, {data: calls}] = await Promise.all([
    sb.from("bookings_log").select("kind,appointment_at,service,staff,event_time").eq("phone", c.phone).order("event_time", {ascending: false}).limit(50),
    sb.from("call_log").select("call_time,action_taken,summary").eq("phone", c.phone).order("call_time", {ascending: false}).limit(50)]);
  const word = {booked: "Booked", rescheduled: "Moved", cancelled: "Cancelled"};
  if (!$("#hist")) return;
  $("#hist").innerHTML = `<h3>Bookings (all time)</h3>${(books || []).map(b => `<div>${word[b.kind] || esc(b.kind)} · ${b.appointment_at ? fmtDT(b.appointment_at) : ""} · ${esc(b.service || "")}${b.staff ? " · " + esc(b.staff) : ""}</div>`).join("") || '<p class="muted">No bookings made by phone with Maria yet.</p>'}
    <h3>Calls (all time)</h3>${(calls || []).map(x => `<div>${fmtDT(x.call_time)} · ${esc(x.summary || RESULT[x.action_taken] || x.action_taken || "")}</div>`).join("") || '<p class="muted">No calls yet.</p>'}`;
}
function dlg(body, buttons) {
  $("#dlgBody").innerHTML = body; $("#dlgFoot").innerHTML = "";
  return new Promise(res => {
    for (const [label, val, primary] of buttons) {
      const b = document.createElement("button"); b.className = "btn small" + (primary ? "" : " ghost"); b.textContent = label;
      b.onclick = () => { $("#dlg").close(); res(val); }; $("#dlgFoot").appendChild(b);
    }
    $("#dlg").showModal();
  });
}
async function askTick(cb) {
  const m = state.data.msgs.find(x => x.id === cb.dataset.msg), to = !m.done;
  const yes = await dlg(`<h2 style="margin-top:0">${to ? "Mark this as done?" : "Mark this as NOT done?"}</h2><p>${esc(m.caller_name || "")} – ${esc((m.body || "").slice(0, 120))}</p>`, [["No", false], ["Yes", true, true]]);
  if (!yes) return;
  const {error} = await sb.rpc("set_message_done", {p_id: m.id, p_done: to});
  if (error) { alertBox("Could not save that: " + error.message); return; }
  const {data} = await sb.from("messages").select("*").eq("id", m.id).single();
  Object.assign(m, data); render();
}
function alertBox(t) { dlg(`<p>${esc(t)}</p>`, [["OK", null, true]]); }

// ---------- live light ----------
async function live() {
  // one row per line (copy of Maria); a row left "on a call" for over 30 min is stale (a copy that died mid-call)
  const {data} = await sb.from("line_copies").select("active,updated_at");
  const n = (data || []).filter(r => r.active && (Date.now() - new Date(r.updated_at)) < 30 * 60 * 1000).length;
  const onCall = n > 0;
  $("#liveDot").classList.toggle("on", onCall);
  $("#live").classList.toggle("on", onCall);
  $("#liveText").innerHTML = onCall ? (n > 1 ? `<span class="long">Maria is on ${n} calls</span><span class="short">On ${n} calls</span>`
    : '<span class="long">Maria is on a call</span><span class="short">On a call</span>') : '<span class="long">Maria is free</span><span class="short">Free</span>';
}

function trText(t) {
  const core = t.trim(); if (!core) return null;
  let out = EL[core];
  if (out == null) for (const [re, fn] of EL_RE) { const m = core.match(re); if (m) { out = fn(...m); break; } }
  if (out == null) { let x = core; for (const [re, to] of EL_IN) x = x.replace(re, to); if (x !== core) out = x; }
  return out == null ? null : t.replace(core, out);
}
function translate(root) {
  if (LANGSEL !== "el" || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    if (n.parentElement && n.parentElement.closest("pre, #tx")) continue;
    const t = trText(n.nodeValue); if (t != null && t !== n.nodeValue) n.nodeValue = t;
  }
  for (const el of root.querySelectorAll("[placeholder]")) if (el.placeholder.startsWith("Search")) el.placeholder = "Αναζήτηση: όνομα, επώνυμο, τηλέφωνο…";
}
if (LANGSEL === "el") {
  document.documentElement.lang = "el";
  const mo = new MutationObserver(() => { mo.disconnect(); translate(document.body); mo.observe(document.body, {childList: true, subtree: true, characterData: true}); });
  translate(document.body); mo.observe(document.body, {childList: true, subtree: true, characterData: true});
}

// ---------- start ----------
async function start() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { show("loginView"); return; }
  if (location.hash.includes("type=recovery")) { show("resetView"); return; }
  // Q7 (b): owner (everything), viewer (the same, cannot tick), staff (only their own day, no money).
  // Before the database has roles, everyone is an owner, as today.
  let {data: m, error: merr} = await sb.from("portal_members").select("business,display_name,role,staff_name").maybeSingle();
  if (merr) ({data: m} = await sb.from("portal_members").select("business,display_name").maybeSingle());
  me = m; ROLE = (m && m.role) || "owner"; show("appView");
  if (ROLE === "staff") {
    for (const b of $("#tabs").querySelectorAll("button")) b.classList.toggle("hide", b.dataset.tab !== "myday");
    $("#mydayTab").classList.add("on"); state.tab = "myday";
  } else {
    // Plan & bills only once the database has it
    const {error: berr} = await sb.from("billing").select("business").limit(1);
    $("#planTab").classList.toggle("hide", !!berr);
  }
  $("#bizName").textContent = m ? (m.business === "smile-better" ? "Smile Better" : m.business) : "Maria";
  $("#bizLogo").textContent = ($("#bizName").textContent.trim()[0] || "M").toUpperCase();
  load(); live(); setInterval(live, 15000);
}
start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
